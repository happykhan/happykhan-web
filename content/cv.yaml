positions:
  - title: Senior Bioinformatician
    organization: The Centre for Genomic Pathogen Surveillance (CGPS), University of Oxford, UK
    startYear: 2024
    endYear: null
    current: true
    description: Develop pathogen-genomics software, analytical methods and training for international genomic-surveillance programmes.
    highlights:
      - Work within the PathogenWatch and AMRwatch development teams; built and benchmarked E. coli and Salmonella analysis containers and integrated BactScout and QualiBact quality controls into PathogenWatch
      - Designed QualiBact, deriving versioned assembly-quality thresholds from 2,440,377 assemblies across 307 bacterial species and testing how failed quality control changes AMR detection
      - Coordinate bioinformatics delivery across GHRU2 partner sites, including proficiency testing across five international organisations
      - Contribute genomic-surveillance expertise to draft WHO AMR guidance, PATH-SAFE national recommendations and training in PathogenWatch, Microreact and genomic epidemiology
      - Contributed to vaccines.watch through design discussion and review, and provided input on the manuscript
  - title: Interim Head of Informatics
    organization: Quadram Institute Bioscience, Norwich, UK
    startYear: May 2023
    endYear: Dec 2023
    highlights:
      - Led a five-person bioinformatics service and held responsibility for computational infrastructure, budgets, training and delivery
      - Led technical planning as PI for the £1.49 million BBSRC QIB Cloud Renewal capital award
      - Managed service delivery through ticketing, time allocation, reproducible analysis expectations and staff development
  - title: Bioinformatics Scientific Programmer
    organization: Quadram Institute Bioscience, Norwich, UK
    startYear: Dec 2018
    endYear: Apr 2023
    highlights:
      - Built and ran QIB COG-UK bioinformatics infrastructure supporting the release of more than 80,000 SARS-CoV-2 genomes; managed staff covering processing, analysis and weekly reporting to government stakeholders
      - Developed RonaQC quality-assurance infrastructure and a browser application for operational SARS-CoV-2 genomic surveillance
      - First author on a multi-centre evaluation of the ARTIC sequencing method using data from more than 3,600 clinical samples
      - First-authored a 2022 population-genomics study tracing AMR-carrying Salmonella across Brazilian poultry and UK food and clinical contexts
      - Contributed to the PHA4GE metadata standard adopted by NCBI BioSample and helped develop requirements and provisioning for an institute sample-inventory system
  - title: Senior Research Fellow in Pathogen Bioinformatics
    organization: University of Warwick, UK
    startYear: 2016
    endYear: 2018
    description: Analysed bacterial population genomics and integrated metagenomic data into large-scale surveillance infrastructure.
    highlights:
      - Integrated ancient metagenomes into EnteroBase and co-authored SPARSE, a method for reconstructing microbial strains from metagenomic sequence data
      - Co-developed cgMLST schemes and first-authored the 2018 EnteroBase paper analysing population structure across more than 100,000 Salmonella genomes
  - title: Research Fellow in Genomics of Bacterial Pathogens
    organization: University of Warwick, UK
    startYear: 2014
    endYear: 2016
    description: Developed scientific software and data infrastructure for large-scale bacterial population analysis.
    highlights:
      - Developed EnteroBase middleware and APIs in Python and Flask, designed its database and contributed JavaScript and Jinja views
      - Co-developed GrapeTree for interactive exploration of large genomic datasets and continue to maintain the software
  - title: Research Associate
    organization: School of Chemistry and Molecular Biosciences, University of Queensland, Australia
    startYear: Mar 2009
    endYear: Nov 2009
    description: System administration and technical support for Linux/MacOSX workstations. Developed automated bioinformatics pipelines for the Beatson Microbial Genomics group.
  - title: Research Associate
    organization: School of Chemistry and Molecular Biosciences, University of Queensland, Australia
    startYear: Nov 2008
    endYear: Jan 2009
    description: Programmed software pipelines for bioinformatics, especially parallelization on high-performance computer clusters. Server administration for sharing bacterial genomics data.
