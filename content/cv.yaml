positions:
  - title: Senior Bioinformatician
    organization: The Centre for Genomic Pathogen Surveillance (CGPS), University of Oxford, UK
    startYear: 2024
    endYear: null
    current: true
    description: Leading development and integration of pathogen genomics platforms for global public health surveillance.
    highlights:
      - Lead author and core developer of Pathogenwatch (medRxiv 2026) — adopted by 14,389 users across 165 countries; 875,000+ curated public genomes; MLST for 37+ species
      - Contributor to AMRwatch (620,700 pathogen genomes, PLOS Global Public Health 2025) and vaccines.watch — open surveillance platforms serving researchers and public health agencies globally
      - Lead bioinformatics strategy and analytical pipeline development at CGPS; represent the group at national and international forums
      - Named member of the UKHSA TARZET Invasive Meningococcal Disease Technical Group, contributing to the 2026 MenB outbreak response (Canterbury cluster, 23 cases)
      - Translate pathogen genomic data into actionable public health outputs in collaboration with WHO, NIHR, and Gates Foundation-funded programmes
  - title: Bioinformatics Scientific Programmer – Interim Head of Informatics
    organization: Quadram Institute Bioscience, Norwich, UK
    startYear: 2018
    endYear: 2023
    highlights:
      - Appointed interim Head of Informatics (May 2023), leading core bioinformatics team of five
      - Secured £1.4M BBSRC capital grant for computational resources through strategic planning
      - Led national SARS-CoV-2 surge sequencing (Sept 2021-Apr 2022) - £4.5M project value
      - "COG-UK Consortium: contributed analysis and curation of 80,000 SARS-CoV-2 genomes"
      - Developed institute sample inventory management system
      - PHA4GE infrastructure working group member - building consensus for public health bioinformatics
  - title: Senior Research Fellow in Pathogen Bioinformatics
    organization: University of Warwick, UK
    startYear: 2016
    endYear: 2018
    description: Integrated ancient metagenomes into EnteroBase and sequenced/analyzed 10,000 modern S. enterica genomes.
  - title: Research Fellow in Genomics of Bacterial Pathogens
    organization: University of Warwick, UK
    startYear: 2014
    endYear: 2016
    description: Co-developed EnteroBase (enterobase.warwick.ac.uk) for big-data genomic analysis of enteric pathogens and adapted robotic genotyping for high-throughput sequencing library preparation.
  - title: Research Associate
    organization: School of Chemistry and Molecular Biosciences, University of Queensland, Australia
    startYear: Mar 2009
    endYear: Nov 2009
    description: System administration and technical support for Linux/MacOSX workstations. Developed automated bioinformatics pipelines for the Beatson Microbial Genomics group.
  - title: Research Associate
    organization: School of Chemistry and Molecular Biosciences, University of Queensland, Australia
    startYear: Nov 2008
    endYear: Jan 2009
    description: Programmed software pipelines for bioinformatics, especially parallelization on high-performance computer clusters. Server administration for sharing bacterial genomics data.
